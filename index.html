<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaultify — Financial Insights & Tracker</title>
    <!-- Tailwind CSS v3 Stable CDN with Design.md token mapping -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        vaultify: {
                            primary: '#0A3A2F',
                            primaryHover: '#062B22',
                            bg: '#F4F5F6',
                            surface: '#FFFFFF',
                            textPrimary: '#111827',
                            textSecondary: '#6B7280',
                            border: '#E5E7EB',
                            success: '#10B981',
                            error: '#EF4444'
                        },
                        dark: {
                            bg: '#0B1311',
                            surface: '#111F1C',
                            textPrimary: '#F4F5F6',
                            textSecondary: '#9CA3AF',
                            border: '#1F332E'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    borderRadius: {
                        sm: '6px',
                        md: '8px',
                        lg: '12px',
                        full: '9999px'
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS v2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 9999px; }
    </style>
</head>
<body class="h-full bg-vaultify-bg dark:bg-dark-bg text-vaultify-textPrimary dark:text-dark-textPrimary antialiased transition-colors duration-200">

    <div id="app" class="h-full flex flex-col">
        <!-- Rendered dynamically by Router -->
        <div class="flex items-center justify-center h-full">
            <div class="text-center space-y-3">
                <i class="fa-solid fa-vault text-4xl text-vaultify-primary dark:text-emerald-400 animate-bounce"></i>
                <p class="text-sm font-medium text-vaultify-textSecondary dark:text-dark-textSecondary">Loading Vaultify Secure Workspace...</p>
            </div>
        </div>
    </div>

    <!-- Notification Toast Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        const SUPABASE_URL = "https://adqghzkkfshogssnsjke.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkcWdoemtrZnNob2dzc25zamtlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMDMwMDcsImV4cCI6MjEwNjY3OTAwN30.LTFJDCS8oemiMPZjOdxkK8HAK4kp2T94UrXpmzCpmSs";
        
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentProfile = null;
        let currentCurrency = 'USD';
        let exchangeRates = { USD: 1, EUR: 0.92, GBP: 0.79, IDR: 15600 };
        let currencySymbols = { USD: '$', EUR: '€', GBP: '£', IDR: 'Rp ' };
        let mobileMenuOpen = false;

        function formatMoney(amountInUSD) {
            const rate = exchangeRates[currentCurrency] || 1;
            const converted = amountInUSD * rate;
            const symbol = currencySymbols[currentCurrency] || '$';
            if (currentCurrency === 'IDR') {
                return symbol + Math.round(converted).toLocaleString('id-ID');
            }
            return symbol + converted.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto px-4 py-3 rounded-lg text-sm font-medium shadow-lg flex items-center gap-3 transition-all transform translate-y-2 opacity-0 ${
                type === 'success' ? 'bg-vaultify-primary text-white' : 'bg-rose-600 text-white'
            }`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-triangle-exclamation'}"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 50);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('vaultify_theme', isDark ? 'dark' : 'light');
        }

        if (localStorage.getItem('vaultify_theme') === 'dark' || (!localStorage.getItem('vaultify_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }

        async function getAuthUser() {
            const { data: { session } } = await db.auth.getSession();
            if (session) {
                currentUser = session.user;
                const { data: profile } = await db.from('profiles').select('*').eq('id', currentUser.id).single();
                if (profile) {
                    currentProfile = profile;
                    currentCurrency = profile.currency || 'USD';
                }
                return currentUser;
            }
            return null;
        }

        const routes = {
            '/': renderDashboard,
            '/login': renderLogin,
            '/dashboard': renderDashboard,
            '/analytics': renderAnalytics,
            '/transactions': renderTransactions,
            '/transfers': renderTransfers,
            '/settings': renderSettings
        };

        async function router() {
            const hash = location.hash.slice(1) || '/dashboard';
            const baseRoute = '/' + hash.split('/')[1];
            const appEl = document.getElementById('app');

            if (baseRoute === '/login') {
                const user = await getAuthUser();
                if (user) {
                    location.hash = '#/dashboard';
                    return;
                }
                renderLogin(appEl);
                return;
            }

            const user = await getAuthUser();
            if (!user) {
                location.hash = '#/login';
                return;
            }

            const viewFunction = routes[baseRoute] || renderDashboard;
            await viewFunction(appEl);
        }

        window.addEventListener('hashchange', router);
        window.addEventListener('DOMContentLoaded', router);

        function renderLogin(container) {
            container.innerHTML = `
                <div class="flex-1 flex flex-col lg:flex-row items-center justify-center p-6 bg-vaultify-bg dark:bg-dark-bg">
                    <div class="w-full max-w-md bg-white dark:bg-dark-surface p-8 rounded-lg border border-vaultify-border dark:border-dark-border shadow-sm space-y-6">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-lg bg-vaultify-primary flex items-center justify-center text-white font-bold text-lg shadow-sm">
                                <i class="fa-solid fa-vault"></i>
                            </div>
                            <div>
                                <h1 class="text-xl font-bold tracking-tight text-vaultify-textPrimary dark:text-dark-textPrimary">Vaultify</h1>
                                <p class="text-xs text-vaultify-textSecondary dark:text-dark-textSecondary">Secure Personal Financial Tracker</p>
                            </div>
                        </div>

                        <div class="flex rounded-lg bg-vaultify-bg dark:bg-dark-bg p-1 border border-vaultify-border dark:border-dark-border">
                            <button id="tab-signin" onclick="switchAuthMode('signin')" class="flex-1 py-2 text-xs font-semibold rounded-md bg-white dark:bg-dark-surface shadow-sm transition-all text-vaultify-textPrimary dark:text-dark-textPrimary">Sign In</button>
                            <button id="tab-signup" onclick="switchAuthMode('signup')" class="flex-1 py-2 text-xs font-semibold rounded-md text-vaultify-textSecondary dark:text-dark-textSecondary transition-all">Create Account</button>
                        </div>

                        <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">
                            <div id="name-field-container" class="hidden space-y-1">
                                <label class="text-xs font-medium text-vaultify-textSecondary dark:text-dark-textSecondary">Full Name</label>
                                <input type="text" id="auth-name" placeholder="Aubrey Sabina" class="w-full px-4 py-2.5 bg-vaultify-bg dark:bg-dark-bg border border-vaultify-border dark:border-dark-border rounded-lg text-sm text-vaultify-textPrimary dark:text-dark-textPrimary focus:outline-none focus:ring-2 focus:ring-vaultify-primary">
                            </div>
                            <div class="space-y-1">
                                <label class="text-xs font-medium text-vaultify-textSecondary dark:text-dark-textSecondary">Email Address</label>
                                <input type="email" id="auth-email" required placeholder="name@vaultify.io" class="w-full px-4 py-2.5 bg-vaultify-bg dark:bg-dark-bg border border-vaultify-border dark:border-dark-border rounded-lg text-sm text-vaultify-textPrimary dark:text-dark-textPrimary focus:outline-none focus:ring-2 focus:ring-vaultify-primary">
                            </div>
                            <div class="space-y-1">
                                <label class="text-xs font-medium text-vaultify-textSecondary dark:text-dark-textSecondary">Password</label>
                                <input type="password" id="auth-password" required placeholder="••••••••" class="w-full px-4 py-2.5 bg-vaultify-bg dark:bg-dark-bg border border-vaultify-border dark:border-dark-border rounded-lg text-sm text-vaultify-textPrimary dark:text-dark-textPrimary focus:outline-none focus:ring-2 focus:ring-vaultify-primary">
                            </div>
                            <button type="submit" id="auth-submit-btn" class="w-full py-3 bg-vaultify-primary text-white rounded-lg font-semibold text-sm hover:bg-vaultify-primaryHover transition-colors shadow-sm">Sign In to Vaultify</button>
                        </form>
                    </div>
                </div>
            `;
        }

        let isSignUpMode = false;
        function switchAuthMode(mode) {
            isSignUpMode = mode === 'signup';
            const tabIn = document.getElementById('tab-signin');
            const tabUp = document.getElementById('tab-signup');
            const nameField = document.getElementById('name-field-container');
            const btn = document.getElementById('auth-submit-btn');

            if (isSignUpMode) {
                tabUp.className = "flex-1 py-2 text-xs font-semibold rounded-md bg-white dark:bg-dark-surface shadow-sm transition-all text-vaultify-textPrimary dark:text-dark-textPrimary";
                tabIn.className = "flex-1 py-2 text-xs font-semibold rounded-md text-vaultify-textSecondary dark:text-dark-textSecondary transition-all";
                nameField.classList.remove('hidden');
                btn.textContent = "Create Account";
            } else {
                tabIn.className = "flex-1 py-2 text-xs font-semibold rounded-md bg-white dark:bg-dark-surface shadow-sm transition-all text-vaultify-textPrimary dark:text-dark-textPrimary";
                tabUp.className = "flex-1 py-2 text-xs font-semibold rounded-md text-vaultify-textSecondary dark:text-dark-textSecondary transition-all";
                nameField.classList.add('hidden');
                btn.textContent = "Sign In to Vaultify";
            }
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const fullName = document.getElementById('auth-name').value;
            const btn = document.getElementById('auth-submit-btn');

            btn.disabled = true;
            btn.textContent = "Processing...";

            try {
                if (isSignUpMode) {
                    const { data, error } = await db.auth.signUp({
                        email,
                        password,
                        options: { data: { full_name: fullName || 'Vaultify User' } }
                    });
                    if (error) throw error;
                    showToast("Account created successfully! Welcome.");
                } else {
                    const { data, error } = await db.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    showToast("Signed in successfully!");
                }
                location.hash = '#/dashboard';
            } catch (err) {
                showToast(err.message, 'error');
                btn.disabled = false;
                btn.textContent = isSignUpMode ? "Create Account" : "Sign In to Vaultify";
            }
        }

        function toggleMobileMenu() {
            mobileMenuOpen = !mobileMenuOpen;
            const drawer = document.getElementById('mobile-drawer');
            const backdrop = document.getElementById('mobile-backdrop');
            if (mobileMenuOpen) {
                drawer.classList.remove('-translate-x-full');
                backdrop.classList.remove('hidden');
            } else {
                drawer.classList.add('-translate-x-full');
                backdrop.classList.add('hidden');
            }
        }

        function renderShell(activeTab, contentHTML) {
            const userName = currentProfile?.full_name || currentUser?.email?.split('@')[0] || 'User';
            const userInitials = userName.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();

            const sidebarContent = `
                <div class="p-6 flex items-center justify-between border-b border-vaultify-border dark:border-dark-border">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-lg bg-vaultify-primary flex items-center justify-center text-white font-bold text-lg shadow-sm">
                            <i class="fa-solid fa-vault"></i>
                        </div>
                        <span class="text-xl font-bold tracking-tight text-vaultify-textPrimary dark:text-dark-textPrimary">Vaultify</span>
                    </div>
                    <!-- Close button for mobile drawer -->
                    <button onclick="toggleMobileMenu()" class="md:hidden text-vaultify-textSecondary hover:text-vaultify-textPrimary p-2">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>

                <div class="p-4 space-y-6 flex-1 overflow-y-auto">
                    <div>
                        <p class="px-3 text-xs font-semibold uppercase tracking-wider text-vaultify-textSecondary dark:text-dark-textSecondary mb-2">Main Menu</p>
                        <nav class="space-y-1">
                            <a href="#/dashboard" onclick="if(mobileMenuOpen) toggleMobileMenu()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${activeTab === 'dashboard' ? 'bg-vaultify-primary text-white shadow-sm' : 'text-vaultify-textSecondary dark:text-dark-textSecondary hover:bg-vaultify-bg dark:hover:bg-dark-bg'}">
                                <i class="fa-solid fa-chart-pie w-5"></i> Dashboard
                            </a>
                            <a href="#/analytics" onclick="if(mobileMenuOpen) toggleMobileMenu()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${activeTab === 'analytics' ? 'bg-vaultify-primary text-white shadow-sm' : 'text-vaultify-textSecondary dark:text-dark-textSecondary hover:bg-vaultify-bg dark:hover:bg-dark-bg'}">
                                <i class="fa-solid fa-chart-line w-5"></i> Analytics
                            </a>
                            <a href="#/transactions" onclick="if(mobileMenuOpen) toggleMobileMenu()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${activeTab === 'transactions' ? 'bg-vaultify-primary text-white shadow-sm' : 'text-vaultify-textSecondary dark:text-dark-textSecondary hover:bg-vaultify-bg dark:hover:bg-dark-bg'}">
                                <i class="fa-solid fa-arrow-right-arrow-left w-5"></i> Transactions
                            </a>
                            <a href="#/transfers" onclick="if(mobileMenuOpen) toggleMobileMenu()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${activeTab === 'transfers' ? 'bg-vaultify-primary text-white shadow-sm' : 'text-vaultify-textSecondary dark:text-dark-textSecondary hover:bg-vaultify-bg dark:hover:bg-dark-bg'}">
                                <i class="fa-solid fa-paper-plane w-5"></i> Transfers
                            </a>
                        </nav>
                    </div>

                    <div>
                        <p class="px-3 text-xs font-semibold uppercase tracking-wider text-vaultify-textSecondary dark:text-dark-textSecondary mb-2">Others</p>
                        <nav class="space-y-1">
                            <a href="#/settings" onclick="if(mobileMenuOpen) toggleMobileMenu()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${activeTab === 'settings' ? 'bg-vaultify-primary text-white shadow-sm' : 'text-vaultify-textSecondary dark:text-dark-textSecondary hover:bg-vaultify-bg dark:hover:bg-dark-bg'}">
                                <i class="fa-solid fa-gear w-5"></i> Settings
                            </a>
                            <button onclick="handleSignOut()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/30 transition-colors">
                                <i class="fa-solid fa-right-from-bracket w-5"></i> Sign Out
                            </button>
                        </nav>
                    </div>
                </div>

                <div class="p-4 border-t border-vaultify-border dark:border-dark-border flex items-center gap-3 bg-vaultify-bg/50 dark:bg-dark-bg/50">
                    <div class="w-10 h-10 rounded-full bg-vaultify-primary text-white flex items-center justify-center font-bold text-sm shrink-0">
                        ${userInitials}
                    </div>
                    <div class="overflow-hidden">
                        <p class="text-sm font-semibold text-vaultify-textPrimary dark:text-dark-textPrimary truncate">${userName}</p>
                        <p class="text-xs text-vaultify-textSecondary dark:text-dark-textSecondary truncate">${currentUser?.email}</p>
                    </div>
                </div>
            `;

            return `
                <div class="h-full flex flex-col md:flex-row overflow-hidden relative">
                    <!-- Desktop Sidebar -->
                    <aside class="hidden md:flex w-64 bg-white dark:bg-dark-surface border-r border-vaultify-border dark:border-dark-border flex-col justify-between shrink-0 select-none">
                        ${sidebarContent}
                    </aside>

                    <!-- Mobile Drawer Backdrop -->
                    <div id="mobile-backdrop" onclick="toggleMobileMenu()" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden backdrop-blur-sm"></div>

                    <!-- Mobile Drawer Sidebar -->
                    <aside id="mobile-drawer" class="fixed inset-y-0 left-0 w-72 bg-white dark:bg-dark-surface border-r border-vaultify-border dark:border-dark-border flex flex-col justify-between shrink-0 z-50 transform -translate-x-full transition-transform duration-300 md:hidden">
                        ${sidebarContent}
                    </aside>

                    <!-- Main Content Wrapper -->
                    <main class="flex-1 flex flex-col h-full overflow-y-auto">
                        <!-- Top Header Bar -->
                        <header class="bg-white dark:bg-dark-surface border-b border-vaultify-border dark:border-vaultify-border px-6 py-4 flex items-center justify-between sticky top-0 z-30">
                            <div class="flex items-center gap-3">
                                <!-- Hamburger Button -->
                                <button onclick="toggleMobileMenu()" class="md:hidden w-10 h-10 rounded-lg border border-vaultify-border dark:border-dark-border flex items-center justify-center text-vaultify-textSecondary dark:text-dark-textSecondary hover:bg-vaultify-bg dark:hover:bg-dark-bg transition-colors" title="Open Menu">
                                    <i class="fa-solid fa-bars text-base"></i>
                                </button>
                                <div>
                                    <h1 class="text-lg md:text-2xl font-bold text-vaultify-textPrimary dark:text-dark-textPrimary truncate">Welcome, ${userName}!</h1>
                                    <p class="text-xs md:text-sm text-vaultify-textSecondary dark:text-dark-textSecondary hidden sm:block">Manage your finances with real-time insights in <span class="font-semibold text-vaultify-primary dark:text-emerald-400">${currentCurrency}</span></p>
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                <button onclick="toggleDarkMode()" class="w-10 h-10 rounded-full border border-vaultify-border dark:border-dark-border flex items-center justify-center text-vaultify-textSecondary dark:text-dark-textSecondary hover:bg-vaultify-bg dark:hover:bg-dark-bg transition-colors" title="Toggle Dark/Light Mode">
                                    <i class="fa-solid fa-moon dark:fa-sun text-sm"></i>
                                </button>
                                <button onclick="openAddTransactionModal()" class="px-3.5 py-2 bg-vaultify-primary text-white text-xs font-semibold rounded-lg hover:bg-vaultify-primaryHover transition-colors flex items-center gap-2 shadow-sm">
                                    <i class="fa-solid fa-plus"></i> <span class="hidden sm:inline">Add Transaction</span>
                                </button>
                            </div>
                        </header>

                        <!-- Dynamic Page Container -->
                        <div class="p-4 md:p-8 space-y-6 max-w-7xl w-full mx-auto flex-1">
                            ${contentHTML}
                        </div>
                    </main>
                </div>
            `;
        }

        async function handleSignOut() {
            await db.auth.signOut();
            currentUser = null;
            currentProfile = null;
            showToast("Signed out successfully");
            location.hash = '#/login';
        }

        async function fetchUserTransactions() {
            const { data, error } = await db.from('transactions').select('*').eq('user_id', currentUser.id).order('transaction_date', { ascending: false });
            if (error) {
                showToast("Failed to fetch transactions", "error");
                return [];
            }
            return data || [];
        }

        async function renderDashboard(container) {
            container.innerHTML = `<div class="text-center py-12"><i class="fa-solid fa-spinner fa-spin text-2xl text-vaultify-primary"></i></div>`;
            const transactions = await fetchUserTransactions();

            let totalIncome = 0;
            let totalExpenses = 0;
            let categorySums = { Housing: 0, Transportation: 0, 'Food & Dining': 0, Subscriptions: 0, Other: 0 };

            transactions.forEach(t => {
                const amt = Number(t.amount);
                if (t.type === 'income') {
                    totalIncome += amt;
                } else {
                    totalExpenses += amt;
                    if (categorySums[t.category] !== undefined) {
                        categorySums[t.category] += amt;
                    } else {
                        categorySums['Other'] = (categorySums['Other'] || 0) + amt;
                    }
                }
            });

            const netRevenue = totalIncome - totalExpenses;
            const savings = Math.max(0, netRevenue * 0.5);
            const totalExpForCat = Object.values(categorySums).reduce((a, b) => a + b, 1);

            const catHousingPct = Math.round((categorySums['Housing'] / totalExpForCat) * 100);
            const catTransportPct = Math.round((categorySums['Transportation'] / totalExpForCat) * 100);
            const catFoodPct = 100 - (catHousingPct + catTransportPct);

            const dashboardHTML = `
                <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                    <h2 class="text-lg font-bold text-vaultify-textPrimary dark:text-dark-textPrimary">Financial Insights Dashboard</h2>
                    <div class="flex items-center gap-3 w-full sm:w-auto">
                        <select onchange="changeCurrency(this.value)" class="bg-white dark:bg-dark-surface border border-vaultify-border dark:border-dark-border text-xs rounded-lg px-3 py-2 font-medium text-vaultify-textPrimary dark:text-dark-textPrimary focus:outline-none">
                            <option value="USD" ${currentCurrency === 'USD' ? 'selected' : ''}>USD ($)</option>
                            <option value="EUR" ${currentCurrency === 'EUR' ? 'selected' : ''}>EUR (€)</option>
                            <option value="GBP" ${currentCurrency === 'GBP' ? 'selected' : ''}>GBP (£)</option>
                            <option value="IDR" ${currentCurrency === 'IDR' ? 'selected' : ''}>IDR (Rp)</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <div class="bg-white dark:bg-dark-surface p-6 rounded-lg border border-vaultify-border dark:border-dark-border shadow-sm flex flex-col justify-between">
                        <div class="flex items-center justify-between">
                            <span class="text-sm font-medium text-vaultify-textSecondary dark:text-dark-textSecondary">Total Income</span>
                            <span class="inline-flex items-center gap-1 text-xs font-semibold px-2 py-0.5 rounded-full bg-emerald-50 dark:bg-emerald-950/40 text-vaultify-success">
                                <i class="fa-solid fa-arrow-up text-[10px]"></i> Live
                            </span>
                        </div>
                        <div class="my-4"><span class="text-3xl font-bold tracking-tight text-vaultify-textPrimary dark:text-dark-textPrimary">${formatMoney(totalIncome)}</span></div>
                        <div class="flex items-center justify-between text-xs text-vaultify-textSecondary dark:text-dark-textSecondary border-t border-vaultify-border dark:border-dark-border pt-3">
                            <span><i class="fa-solid fa-arrow-trend-up text-vaultify-success mr-1"></i> Real-time DB sync</span>

                            <input type="text" id="tx-desc" placeholder="Monthly bill" class="w-full mt-1 px-4 py-2 bg-vaultify-bg dark:bg-dark-bg border border-vaultify-border dark:border-dark-border rounded-lg text-sm focus:outline-none">
                        </div>
                        <button type="submit" class="w-full py-3 bg-vaultify-primary text-white rounded-lg font-semibold text-sm hover:bg-vaultify-primaryHover shadow-sm mt-2">Save Transaction</button>
                    </form>
                </div>
            `;
            document.body.appendChild(modal);
        }

        async function handleTransactionCreate(e) {
            e.preventDefault();
            const title = document.getElementById('tx-title').value;
            const type = document.getElementById('tx-type').value;
            const amount = document.getElementById('tx-amount').value;
            const category = document.getElementById('tx-category').value;
            const account = document.getElementById('tx-account').value;
            const description = document.getElementById('tx-desc').value;

            const { error } = await db.from('transactions').insert({
                user_id: currentUser.id,
                title,
                type,
                amount: parseFloat(amount),
                category,
                account,
                description,
                status: 'Completed'
            });

            if (error) {
                showToast(error.message, 'error');
            } else {
                showToast("Transaction added successfully!");
                document.getElementById('tx-modal').remove();
                router();
            }
        }
    </script>
</body>
</html>
